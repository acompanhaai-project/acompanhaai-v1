spring:
  test:
    mockmvc:
      print: none
  datasource:
    url: jdbc:h2:mem:acompanhaai-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration
app:
  import-worker:
    scheduling-enabled: false
  password-reset:
    limits:
      per-ip: 1000
      global: 10000
server:
  servlet:
    session:
      cookie:
        secure: false
logging:
  level:
    com.icegreen.greenmail: WARN
