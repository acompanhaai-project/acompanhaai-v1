spring:
  config:
    import: optional:file:./application-local.properties
  application:
    name: acompanhaai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/acompanhaai}
    username: ${DB_USERNAME:acompanhaai}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
server:
  tomcat:
    # Descarte limitado do corpo rejeitado para permitir a entrega do erro 413.
    max-swallow-size: 4MB
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
app:
  import-worker:
    poll-delay: 5s
    lease: 2m
    max-attempts: 3
  import-collector:
    timeout: 20s
    max-bytes: 2097152
  extraction:
    # none, gemini ou ollama. A chave do Gemini fica fora do Git (GEMINI_API_KEY).
    provider: ${EXTRACTION_PROVIDER:none}
    timeout: 30s
    max-input-chars: 20000
    max-output-tokens: 1024
    max-attempts: 2
    retry-delay: 2s
    # Chamadas ao provedor por dia (UTC) nesta instância; 0 desativa o limite.
    daily-limit: 200
    failure-threshold: 3
    cooldown: 5m
    gemini:
      base-url: https://generativelanguage.googleapis.com
      model: gemini-2.5-flash-lite
      api-key: ${GEMINI_API_KEY:}
      thinking-budget: 0
    ollama:
      base-url: http://localhost:11434
      model: llama3.2
  import-limits:
    per-user-hourly: 30
    per-user-active: 5
    global-active: 200
