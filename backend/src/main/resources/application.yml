spring:
  config:
    import: optional:file:./application-local.properties
  application:
    name: acompanhaai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/acompanhaai}
    username: ${DB_USERNAME:acompanhaai}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
server:
  tomcat:
    # Descarte limitado do corpo rejeitado para permitir a entrega do erro 413.
    max-swallow-size: 4MB
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
app:
  import-worker:
    poll-delay: 5s
    lease: 2m
    max-attempts: 3
  import-collector:
    timeout: 20s
    max-bytes: 2097152
  import-limits:
    per-user-hourly: 30
    per-user-active: 5
    global-active: 200
