spring:
  config:
    import: optional:file:./application-local.properties
  application:
    name: acompanhaai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/acompanhaai}
    username: ${DB_USERNAME:acompanhaai}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
