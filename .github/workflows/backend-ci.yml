name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      migration_base_sha:
        description: SHA completo de referência para migrações (opcional)
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  migration-policy:
    name: backend-migration-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar histórico para comparar migrações
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Testar política em repositórios descartáveis
        run: node --test scripts/check-migrations.test.cjs
      - name: Rejeitar alteração ou exclusão de migrações existentes
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.migration_base_sha || '' }}
        run: node scripts/check-migrations.cjs
      - name: Publicar resultado da política
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: politica-migracoes-${{ github.sha }}
          path: backend/target/migration-policy/summary.json
          if-no-files-found: warn
          retention-days: 7

  postman-v2:
    name: backend-postman-v2
    needs: migration-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: acompanhaai
          POSTGRES_USER: acompanhaai_qa_admin
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U acompanhaai_qa_admin -d acompanhaai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_PASSWORD: ""
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Configurar Node.js 22 e cache da v2
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/postman/fixtures/v2/package-lock.json
      - name: Restaurar dependências exclusivas da v2
        working-directory: backend/postman/fixtures/v2
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Disponibilizar cliente PostgreSQL
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version
      - name: Empacotar API para regressão HTTP
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - name: Aplicar migrações e executar coleção v2
        run: node scripts/test-postman-v2-ci.cjs --postgres-port 5432
      - name: Publicar resumos sanitizados da v2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testes-postman-v2-${{ github.sha }}
          path: |
            backend/postman/reports/v2/*/summary.json
            backend/target/kan34-postgres-*/summary.json
          if-no-files-found: warn
          retention-days: 7

  build-test:
    name: backend-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DB_PASSWORD: ""

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Executar build e testes
        run: |
          ./mvnw --batch-mode --no-transfer-progress verify \
            "-Dspring.datasource.url=jdbc:h2:mem:acompanhaai-ci;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1" \
            "-Dspring.datasource.username=sa" \
            "-Dspring.datasource.password="

      - name: Disponibilizar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testes-${{ github.sha }}
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/surefire-reports/*.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Disponibilizar JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ github.sha }}
          path: backend/target/acompanhaai-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

  database-role-isolation:
    name: backend-database-role-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: acompanhaai
          POSTGRES_USER: acompanhaai_qa_admin
          POSTGRES_PASSWORD: ci-disposable-only
          # Exclusivo para o serviço descartável deste job; não usar em produção.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U acompanhaai_qa_admin -d acompanhaai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_PASSWORD: ""
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw
      - name: Validar provisionamento e migrações com identidades separadas
        run: |
          ./mvnw --batch-mode --no-transfer-progress verify \
            "-Dkan29.isolated=true" \
            "-Dtest=DatabaseRoleMigrationIntegrationTest" \
            "-Dspring.datasource.url=jdbc:postgresql://127.0.0.1:5432/acompanhaai" \
            "-Dspring.datasource.username=acompanhaai_qa_admin" \
            "-Dspring.datasource.password="
      - name: Validar API e permissões com runtime restrito
        run: |
          ./mvnw --batch-mode --no-transfer-progress verify \
            "-Dkan29.isolated=true" \
            "-Dtest=*,!PostgresMigrationIntegrationTest,!DatabaseRoleMigrationIntegrationTest" \
            "-Dspring.datasource.url=jdbc:postgresql://127.0.0.1:5432/acompanhaai" \
            "-Dspring.datasource.username=acompanhaai_app" \
            "-Dspring.datasource.password=" \
            "-Dspring.flyway.user=acompanhaai_migrator" \
            "-Dspring.flyway.password=" \
            "-Dspring.flyway.locations=classpath:db/migration,classpath:db/callback"
      - name: Disponibilizar relatórios de isolamento de permissões
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testes-permissoes-${{ github.sha }}
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/surefire-reports/*.txt
          if-no-files-found: warn
          retention-days: 7

  postgres-test:
    name: backend-postgres-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: acompanhaai_ci
          POSTGRES_USER: acompanhaai_ci
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U acompanhaai_ci -d acompanhaai_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_PASSWORD: ""
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw
      - name: Validar migrações e regressão no PostgreSQL
        run: |
          ./mvnw --batch-mode --no-transfer-progress verify \
            "-Dspring.datasource.url=jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports[5432] }}/acompanhaai_ci" \
            "-Dspring.datasource.username=acompanhaai_ci" \
            "-Dspring.datasource.password=ci-disposable-only"
      - name: Disponibilizar relatórios PostgreSQL
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testes-postgres-${{ github.sha }}
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/surefire-reports/*.txt
          if-no-files-found: warn
          retention-days: 7
