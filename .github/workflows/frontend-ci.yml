name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  frontend-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências do lockfile
        run: npm ci --no-audit --no-fund
      - name: Conferir formatação
        run: npm run format:check
      - name: Executar lint
        run: npm run lint
      - name: Executar testes Angular
        run: npm run test:ci
      - name: Gerar build de produção
        run: npm run build
      - name: Verificar credenciais no bundle
        run: npm run check:bundle
      - name: Disponibilizar build Angular
        uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: frontend/dist/acompanhaai-web/browser/
          if-no-files-found: error
          retention-days: 7
